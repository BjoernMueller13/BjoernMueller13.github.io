<!doctype html>

<header class="nav">
  <a class="nav__mark" href="#top" data-i18n-aria="nav.backToTop"><img src="img/v2/mark.png" alt="" width="337" height="153"></a>
  <div class="nav__right">
    <a class="pill pill--pink pill--sm" href="#contact" data-i18n="nav.hire"></a>
    <button class="nav__burger" data-i18n-aria="nav.menuOpen" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>

</header>

<nav class="menu" id="menu" aria-label="Main">

<main id="top">

  <!-- HERO: poster shatters on scroll and reveals the logo -->
  <section class="hero" aria-label="Intro">
    <div class="hero__stage">
      <div class="hero__glow" aria-hidden="true"></div>

      <div class="hero__reveal" id="reveal">
        <div class="lockup" aria-hidden="true">
          <img class="lockup__numeral" src="img/v2/numeral.png" alt="" width="1450" height="696">
          <img class="lockup__wordmark" src="img/v2/wordmark.png" alt="" width="1033" height="626">
        </div>
        <h1 class="sr-only">Björn Müller – Product Owner &amp; Senior Consultant</h1>
        <div class="hero__tag">
          <p data-i18n="hero.tag"></p>
          <p class="hero__tag-sub" data-i18n="hero.tagSub"></p>
          <a class="pill pill--lime" href="#missions"><span data-i18n="hero.cta"></span> <i>↓</i></a>
        </div>
      </div>

      <div class="poster" id="poster">
        <picture>
          <source media="(max-width: 700px)" srcset="img/v2/hero-poster-tall.jpg">
          <img class="poster__img" id="posterImg" src="img/v2/hero-poster.jpg" data-i18n-alt="hero.poster.alt" alt="Illustrated portrait of Björn Müller in a suit, arms crossed, in front of a sunset skyline" width="985" height="616">
        </picture>
        <div class="poster__shards" id="shards" aria-hidden="true"></div>
        <svg class="poster__cracks" id="cracks" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>

      <div class="hero__info">
        <div class="hero__info-l"><span data-i18n="hero.info.nowPlaying"></span><b data-i18n="hero.info.role"></b></div>
        <a class="pill pill--pink pill--glow" href="#contact" data-i18n="nav.hire"></a>
        <div class="hero__info-r"><span data-i18n="hero.info.basedIn"></span><b data-i18n="hero.info.location"></b></div>
      </div>
      <div class="hero__chev" aria-hidden="true"></div>
    </div>
  </section>

  <!-- FEATURED: trailer-style trio -->
  <section class="wrap featured" aria-label="Featured missions">
    <div class="tri" id="featured"></div>
  </section>

  <!-- CAREER EDITION: Ultimate-Edition-style banner -->
  <section class="wrap">
    <article class="edition reveal">
      <svg class="edition__palms" viewBox="0 0 1068 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="editionPalms"></svg>
      <p class="edition__kicker" data-i18n="edition.kicker"></p>
      <div class="edition__box">
        <img src="img/portrait.jpg" alt="Illustrated close-up portrait of Björn Müller" width="712" height="1024" loading="lazy">
        <img class="edition__logo" src="img/v2/wordmark.png" alt="" width="1033" height="626" loading="lazy">
      </div>
      <div class="edition__txt">
        <h2 class="title" data-i18n="edition.title"></h2>
        <p data-i18n="edition.desc"></p>
        <a class="pill pill--peach" href="mailto:bjoern.mueller92@gmail.com?subject=CV%20request"><span data-i18n="edition.cta"></span> <i>→</i></a>
      </div>
    </article>
  </section>

  <!-- STORY -->
  <section class="wrap story reveal" id="story">
    <h2 class="story__h" data-i18n="story.h"></h2>
    <p class="story__p" data-i18n="story.p"></p>
    <ul class="facts">
      <li><span data-i18n="story.fact.class.k"></span><span data-i18n="story.fact.class.v"></span></li>
      <li><span data-i18n="story.fact.base.k"></span><span data-i18n="story.fact.base.v"></span></li>
      <li><span data-i18n="story.fact.lang.k"></span><span data-i18n="story.fact.lang.v"></span></li>
      <li><span data-i18n="story.fact.motto.k"></span><span data-i18n="story.fact.motto.v"></span></li>
    </ul>
  </section>

  <!-- MISSIONS -->
  <section class="wrap missions" id="missions">
    <div class="sechead reveal"><h2 class="grad-h" data-i18n="section.missions"></h2><span class="textlink" data-i18n="section.missionsSub"></span></div>
    <div class="missions__list" id="missionList"></div>
  </section>

  <!-- ARSENAL -->
  <section class="band" id="arsenal">
    <div class="wrap">
      <div class="sechead reveal"><h2 class="grad-h" data-i18n="section.arsenal"></h2><a class="textlink" href="mailto:bjoern.mueller92@gmail.com?subject=CV%20request"><span data-i18n="section.requestCV"></span> <i>→</i></a></div>
      <div class="arsenal" id="arsenalGrid"></div>
      <div class="stats reveal">
        <div class="stats__head"><h3 data-i18n="stats.title"></h3><span data-i18n="stats.sub"></span></div>
        <div class="stats__grid" id="stats"></div>
      </div>
    </div>
  </section>

  <!-- SIDE QUESTS -->
  <section class="wrap block" id="sidequests">
    <div class="sechead reveal"><h2 class="grad-h" data-i18n="section.quests"></h2><span class="textlink" data-i18n="section.questsSub"></span></div>
    <div class="news" id="quests"></div>
  </section>

  <!-- TRAVELS -->
  <section class="wrap block" id="travels">
    <article class="banner banner--travel reveal" id="travelBanner"></article>
    <div class="continents reveal" id="continents"></div>
  </section>

  <!-- TRAINING -->
  <section class="wrap block" id="training">
    <div class="sechead reveal"><h2 class="grad-h" data-i18n="section.training"></h2><span class="textlink" data-i18n="section.trainingSub"></span></div>
    <div class="news news--compact" id="trainingList"></div>
  </section>

</main>

  <a class="foot__cta" href="mailto:bjoern.mueller92@gmail.com">

  <ul class="foot__social">

    <li><a href="https://www.xing.com/profile/Bjoern_Mueller192" target="_blank" rel="noopener" data-i18n-aria="foot.xing"><svg viewBox="0 0 24 24"><path d="M5.3 6.6h3.2l1.9 3.4-2.6 4.6H4.6l2.6-4.6zM15.9 2.5h3.3l-5.5 9.8 3.6 6.9H14l-3.6-6.9z"/></svg></a></li>
    <li><a href="mailto:bjoern.mueller92@gmail.com" data-i18n-aria="foot.email"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v.4l7 4.6 7-4.6V7zm14 2.8-7 4.6-7-4.6V17h14z"/></svg></a></li>

  </div>
</footer>

<dialog class="brief" id="brief" aria-labelledby="briefTitle">
  <button class="brief__x" data-i18n-aria="brief.close">×</button>
  <figure class="brief__art" id="briefArt"></figure>
  <div class="brief__body">
    <p class="eyebrow" id="briefEye"></p>
    <h3 id="briefTitle"></h3>
    <p class="brief__sub" id="briefSub"></p>
    <ul class="brief__list" id="briefList"></ul>
    <div class="chips" id="briefChips"></div>
    <div class="intel" id="briefIntel"></div>
  </div>
</dialog>
